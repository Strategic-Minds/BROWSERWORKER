name: BIDFAST Dashboard Header Edge Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bidfast-dashboard-header-edge-diagnostic.yml'
      - 'app/api/validation/bidfast-dashboard-header-edge-diagnostic/route.ts'
  push:
    branches:
      - auto-builder/bidfast-proof-20260728
    paths:
      - '.github/workflows/bidfast-dashboard-header-edge-diagnostic.yml'
      - 'app/api/validation/bidfast-dashboard-header-edge-diagnostic/route.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidfast-dashboard-header-edge-e9cbd64
  cancel-in-progress: true

env:
  BROWSERWORKER_PREVIEW: https://browserworker-git-auto-builder-82ac4c-strategic-minds-advisory.vercel.app
  BIDFAST_EXPECTED_COMMIT: e9cbd64bddf3a71e4a852aa29cd5b6041d16af5d
  BIDFAST_EXPECTED_REF: auto-builder/bidfast-complete-visual-system
  ROUTE: /dashboard
  RETAINED_BASELINE: '0.836926'
  RELEASE_THRESHOLD: '0.99'

jobs:
  header-edge-diagnostic:
    name: Revision-pinned header edge-region diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Wait for exact BrowserWorker preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          accepted=false
          for attempt in $(seq 1 32); do
            health_status="$(curl -sS -o evidence/health.json -w '%{http_code}' --max-time 30 "${BROWSERWORKER_PREVIEW}/api/health" || true)"
            diagnostic_status="$(curl -sS -o evidence/dashboard-header-edge-diagnostic.json -w '%{http_code}' --max-time 210 "${BROWSERWORKER_PREVIEW}/api/validation/bidfast-dashboard-header-edge-diagnostic?expected_commit=${BIDFAST_EXPECTED_COMMIT}" || true)"
            printf '%s\n' "$health_status" > evidence/health.http-status.txt
            printf '%s\n' "$diagnostic_status" > evidence/dashboard-header-edge-diagnostic.http-status.txt
            commit="$(node -e "try{const j=require('./evidence/dashboard-header-edge-diagnostic.json');process.stdout.write(String(j.source_revision?.commit_sha||''))}catch{}")"
            if [[ "$health_status" == "200" && "$diagnostic_status" == "200" && "$commit" == "$BIDFAST_EXPECTED_COMMIT" ]]; then
              accepted=true
              break
            fi
            echo "attempt=${attempt} health=${health_status:-none} diagnostic=${diagnostic_status:-none} commit=${commit:-unknown}"
            if [[ "$attempt" != "32" ]]; then sleep 20; fi
          done
          test "$accepted" = true

      - name: Execute retained dashboard parity proof
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${BROWSERWORKER_PREVIEW}/api/validation/bidfast-parity-v3?route=%2Fdashboard&expected_commit=${BIDFAST_EXPECTED_COMMIT}"
          accepted=false
          for attempt in $(seq 1 12); do
            status="$(curl -sS --max-time 210 -o evidence/dashboard-parity.json -w '%{http_code}' "$endpoint" || true)"
            printf '%s\n' "$status" > evidence/dashboard-parity.http-status.txt
            commit="$(node -e "try{const j=require('./evidence/dashboard-parity.json');process.stdout.write(String(j.source_revision?.commit_sha||''))}catch{}")"
            if [[ "$status" == "200" && "$commit" == "$BIDFAST_EXPECTED_COMMIT" ]]; then
              accepted=true
              break
            fi
            echo "attempt=${attempt} status=${status:-none} commit=${commit:-unknown}"
            if [[ "$attempt" != "12" ]]; then sleep 25; fi
          done
          test "$accepted" = true

      - name: Enforce provenance, reference integrity, baseline, and technical gates
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const diagnostic = JSON.parse(fs.readFileSync('evidence/dashboard-header-edge-diagnostic.json', 'utf8'))
          const parity = JSON.parse(fs.readFileSync('evidence/dashboard-parity.json', 'utf8'))
          const failures = []
          const expectedCommit = process.env.BIDFAST_EXPECTED_COMMIT
          const expectedRef = process.env.BIDFAST_EXPECTED_REF
          const score = Number(parity?.metrics?.composite_score)

          if (diagnostic.ok !== true) failures.push(`diagnostic_ok=${String(diagnostic.ok)}`)
          if (diagnostic.provenance_pass !== true) failures.push(`diagnostic_provenance_pass=${String(diagnostic.provenance_pass)}`)
          if (diagnostic.integrity_pass !== true) failures.push(`diagnostic_integrity_pass=${String(diagnostic.integrity_pass)}`)
          if (diagnostic.technical_pass !== true) failures.push(`diagnostic_technical_pass=${String(diagnostic.technical_pass)}`)
          if (diagnostic.route !== process.env.ROUTE) failures.push(`diagnostic_route=${String(diagnostic.route)}`)
          if (diagnostic.source_revision?.commit_sha !== expectedCommit) failures.push(`diagnostic_commit=${String(diagnostic.source_revision?.commit_sha)}`)
          if (diagnostic.source_revision?.commit_ref !== expectedRef) failures.push(`diagnostic_ref=${String(diagnostic.source_revision?.commit_ref)}`)
          if (diagnostic.reference?.sha256 !== diagnostic.reference?.expected_sha256) failures.push('diagnostic_reference_hash_mismatch')

          for (const name of ['console_errors', 'app_network_errors', 'http_errors']) {
            if (!Array.isArray(diagnostic[name]) || diagnostic[name].length !== 0) failures.push(`diagnostic_${name}=${JSON.stringify(diagnostic[name])}`)
            if (!Array.isArray(parity[name]) || parity[name].length !== 0) failures.push(`parity_${name}=${JSON.stringify(parity[name])}`)
          }

          const regions = diagnostic?.analysis?.regions || {}
          for (const name of ['header', 'logo', 'actions', 'search']) {
            const region = regions[name]
            if (!region) {
              failures.push(`region_missing=${name}`)
              continue
            }
            for (const value of [region.baseline?.composite_score, region.best_reference_offset?.dx, region.best_reference_offset?.dy, region.best_reference_offset?.metrics?.composite_score, region.predicted_composite_gain]) {
              if (!Number.isFinite(Number(value))) failures.push(`region_non_finite=${name}`)
            }
            if (Number(region.best_reference_offset?.metrics?.composite_score) < Number(region.baseline?.composite_score)) failures.push(`region_best_below_baseline=${name}`)
          }

          if (parity.ok !== true) failures.push(`parity_ok=${String(parity.ok)}`)
          if (parity.provenance_pass !== true) failures.push(`parity_provenance_pass=${String(parity.provenance_pass)}`)
          if (parity.integrity_pass !== true) failures.push(`parity_integrity_pass=${String(parity.integrity_pass)}`)
          if (parity.technical_pass !== true) failures.push(`parity_technical_pass=${String(parity.technical_pass)}`)
          if (parity.source_revision?.commit_sha !== expectedCommit) failures.push(`parity_commit=${String(parity.source_revision?.commit_sha)}`)
          if (parity.source_revision?.commit_ref !== expectedRef) failures.push(`parity_ref=${String(parity.source_revision?.commit_ref)}`)
          if (!Number.isFinite(score) || score < Number(process.env.RETAINED_BASELINE)) failures.push(`composite_score=${String(score)} baseline=${process.env.RETAINED_BASELINE}`)

          const summary = {
            application_commit: expectedCommit,
            application_ref: expectedRef,
            route: process.env.ROUTE,
            retained_baseline: Number(process.env.RETAINED_BASELINE),
            score,
            baseline_reconfirmed: Number.isFinite(score) && score >= Number(process.env.RETAINED_BASELINE),
            release_threshold: Number(process.env.RELEASE_THRESHOLD),
            release_threshold_pass: Number.isFinite(score) && score >= Number(process.env.RELEASE_THRESHOLD),
            parity_metrics: parity.metrics,
            reference: diagnostic.reference,
            normalized: diagnostic.analysis?.normalized,
            regions,
            source_revision: parity.source_revision,
            console_error_count: parity.console_errors?.length,
            application_network_error_count: parity.app_network_errors?.length,
            http_error_count: parity.http_errors?.length,
            failures,
            candidate_authorized: false,
            release_authorized: false,
          }
          fs.writeFileSync('evidence/dashboard-header-edge-summary.json', JSON.stringify(summary, null, 2) + '\n')
          console.log(JSON.stringify(summary, null, 2))
          if (failures.length) process.exit(1)
          NODE

      - name: Upload immutable header-edge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidfast-dashboard-header-edge-diagnostic-e9cbd64
          path: evidence/
          if-no-files-found: error
          retention-days: 30
