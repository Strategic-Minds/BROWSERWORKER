name: Build BIDFAST BrowserWorker Parity

on:
  push:
    branches:
      - auto-builder/bidfast-reference-parity-20260730
    paths:
      - .autobuilder/bidfast-parity.ready

permissions:
  contents: write

concurrency:
  group: browserworker-bidfast-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: auto-builder/bidfast-reference-parity-20260730
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install and type-check
        run: |
          npm ci
          npm run type-check

      - name: Production build
        run: npm run build

      - name: Commit verified BrowserWorker candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .autobuilder
          rm -f .github/workflows/materialize-bidfast-parity.yml
          git config user.name "BIDFAST Auto Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(browserworker): install BIDFAST visual parity engine"
          git push origin HEAD:auto-builder/bidfast-reference-parity-20260730
