name: BIDFAST Tenant Retention Config Provenance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bidfast-workflow-role-config-provenance.yml'
  push:
    branches:
      - auto-builder/bidfast-proof-20260728
    paths:
      - '.github/workflows/bidfast-workflow-role-config-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidfast-tenant-retention-config-provenance-9048486
  cancel-in-progress: true

env:
  BROWSERWORKER_PREVIEW: https://browserworker-git-auto-builder-82ac4c-strategic-minds-advisory.vercel.app
  BIDFAST_EXPECTED_COMMIT: 9048486d754646d7a39ddde98fd7c65108876085
  BIDFAST_EXPECTED_REF: auto-builder/bidfast-complete-visual-system
  BIDFAST_EXPECTED_SUPABASE_PROJECT_REF: mhaovpyegtysfgualplu

jobs:
  provenance:
    name: Exact revision and governed Supabase proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify exact Supabase configuration provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          endpoint="${BROWSERWORKER_PREVIEW}/api/validation/bidfast-config-provenance?expected_commit=${BIDFAST_EXPECTED_COMMIT}"
          accepted=false
          for attempt in $(seq 1 15); do
            status="$(curl -sS --max-time 120 -o evidence/provenance.json -w '%{http_code}' "$endpoint" || true)"
            printf '%s\n' "$status" > evidence/provenance.http-status.txt
            commit="$(node -e "try{const j=require('./evidence/provenance.json');process.stdout.write(String(j.source_revision?.commit_sha||''))}catch{}")"
            if [[ "$status" == "200" && "$commit" == "$BIDFAST_EXPECTED_COMMIT" ]]; then
              accepted=true
              break
            fi
            echo "attempt=${attempt} status=${status:-none} commit=${commit:-unknown}"
            if [[ "$attempt" != "15" ]]; then sleep 20; fi
          done
          test "$accepted" = true

      - name: Enforce exact revision and governed project
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync('evidence/provenance.json', 'utf8'))
          const expectedCommit = process.env.BIDFAST_EXPECTED_COMMIT
          const expectedRef = process.env.BIDFAST_EXPECTED_REF
          const expectedProject = process.env.BIDFAST_EXPECTED_SUPABASE_PROJECT_REF
          const failures = []

          if (body.ok !== true) failures.push(`ok=${String(body.ok)}`)
          if (body.provenance_pass !== true) failures.push(`provenance_pass=${String(body.provenance_pass)}`)
          if (body.configuration_pass !== true) failures.push(`configuration_pass=${String(body.configuration_pass)}`)
          if (body.source_revision?.commit_sha !== expectedCommit) failures.push(`commit=${String(body.source_revision?.commit_sha)}`)
          if (body.source_revision?.commit_ref !== expectedRef) failures.push(`ref=${String(body.source_revision?.commit_ref)}`)
          if (body.health?.configuration?.project_ref !== expectedProject) failures.push(`project_ref=${String(body.health?.configuration?.project_ref)}`)
          if (body.health?.configuration?.expected_project_ref !== expectedProject) failures.push(`expected_project_ref=${String(body.health?.configuration?.expected_project_ref)}`)
          if (body.health?.source?.supabase_url !== 'environment') failures.push(`url_source=${String(body.health?.source?.supabase_url)}`)
          if (body.health?.source?.supabase_publishable_key !== 'environment') failures.push(`key_source=${String(body.health?.source?.supabase_publishable_key)}`)
          if (Array.isArray(body.failures) && body.failures.length !== 0) failures.push(`reported_failures=${JSON.stringify(body.failures)}`)

          const summary = {
            application_commit: expectedCommit,
            application_ref: expectedRef,
            rollback_commit: 'be2ac0328c4e903aed05f4a4b075e3e197bac123',
            candidate_change: 'replace tenant-destroying owner and audit foreign-key cascades with restrictive retention boundaries while preserving client organization and audit deletion revocations',
            expected_supabase_project_ref: expectedProject,
            observed_supabase_project_ref: body.health?.configuration?.project_ref || null,
            configuration_pass: body.configuration_pass === true,
            route_matrix_executed: false,
            operational_matrix_executed: false,
            failures,
            release_authorized: false,
            production_promotion_authorized: false,
          }

          fs.writeFileSync('evidence/summary.json', JSON.stringify(summary, null, 2) + '\n')
          console.log(JSON.stringify(summary, null, 2))
          if (failures.length) process.exit(1)
          NODE

      - name: Upload immutable provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidfast-tenant-retention-config-provenance-9048486
          path: evidence/
          if-no-files-found: error
          retention-days: 30
