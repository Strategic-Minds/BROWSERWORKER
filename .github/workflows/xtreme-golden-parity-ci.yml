name: Xtreme Golden Parity CI

on:
  push:
    branches:
      - auto-builder/xtreme-golden-parity-20260807
  pull_request:
    paths:
      - 'app/api/run/**'
      - 'lib/schemas.ts'
      - 'lib/visual.ts'
      - 'lib/audits.ts'
      - 'tests/visual-parity-schema.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/xtreme-golden-parity-ci.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve dependencies and refresh candidate lockfile
        run: npm install --no-audit --no-fund
      - name: Persist repaired lockfile on safe branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Repair BrowserWorker package lock"
            git push
          fi
      - run: npm run type-check
      - run: npm test -- --runInBand
      - run: npm run build
