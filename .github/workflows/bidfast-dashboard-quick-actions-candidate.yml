name: BIDFAST Dashboard Quick Actions Candidate

on:
  push:
    branches:
      - auto-builder/bidfast-proof-20260728
    paths:
      - '.github/workflows/bidfast-dashboard-quick-actions-candidate.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bidfast-dashboard-quick-actions-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidfast-dashboard-quick-actions-1bc566b8
  cancel-in-progress: true

env:
  BROWSERWORKER_PREVIEW: https://browserworker-git-auto-builder-82ac4c-strategic-minds-advisory.vercel.app
  BIDFAST_ORIGIN: https://bidfast-git-auto-builder-bidfas-2c6093-strategic-minds-advisory.vercel.app
  BIDFAST_EXPECTED_COMMIT: 1bc566b89a16af6ca180bc0a2069070e6630192b
  BIDFAST_EXPECTED_REF: auto-builder/bidfast-complete-visual-system
  DASHBOARD_REFERENCE_ID: 1_GbJt7os0BTg6_9eLBp-Zltd1lk-FHGr
  DASHBOARD_REFERENCE_SHA256: f856235d88dae3b9eabf8f49816abb36a982f2054cc7002b52bdbdac60f207cb
  RETAINED_BASELINE: '0.810876'
  QUICK_ACTIONS_BASELINE: '0.677388'
  QUICK_ACTIONS_EDGE_BASELINE: '0.078722'
  RELEASE_THRESHOLD: '0.99'

jobs:
  validate:
    name: Target improvement and ten-route non-regression
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Wait for exact BIDFAST preview provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/matrix
          for attempt in $(seq 1 50); do
            status="$(curl -sS -o evidence/build-info.json -w '%{http_code}' --max-time 30 "${BIDFAST_ORIGIN}/api/build-info" || true)"
            commit="$(node -e "try{const j=require('./evidence/build-info.json');process.stdout.write(String(j?.source_revision?.commit_sha||''))}catch{}")"
            ref="$(node -e "try{const j=require('./evidence/build-info.json');process.stdout.write(String(j?.source_revision?.commit_ref||''))}catch{}")"
            if [[ "$status" == "200" && "$commit" == "$BIDFAST_EXPECTED_COMMIT" && "$ref" == "$BIDFAST_EXPECTED_REF" ]]; then exit 0; fi
            echo "provenance attempt=${attempt} status=${status:-none} commit=${commit:-unknown} ref=${ref:-unknown}"
            sleep 15
          done
          exit 1

      - name: Validate dashboard target improvement
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${BROWSERWORKER_PREVIEW}/api/bidfast-dashboard-regions?expected_commit=${BIDFAST_EXPECTED_COMMIT}"
          for attempt in $(seq 1 8); do
            status="$(curl -sS --max-time 240 -o evidence/dashboard-quick-actions.json -w '%{http_code}' "$endpoint" || true)"
            if [[ "$status" == "200" ]] && node -e "const j=require('./evidence/dashboard-quick-actions.json');process.exit(j.ok===true&&j.diagnostic_pass===true?0:1)"; then break; fi
            [[ "$attempt" != "8" ]] || exit 1
            sleep 45
          done
          node - <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync('evidence/dashboard-quick-actions.json', 'utf8'))
          const target = body?.analysis?.regions?.find(region => region.name === 'quick_actions')
          const score = Number(body?.metrics?.composite_score)
          const failures = []
          if (body.ok !== true || body.provenance_pass !== true || body.integrity_pass !== true || body.technical_pass !== true) failures.push('dashboard_evidence_gate')
          if (body?.source_revision?.commit_sha !== process.env.BIDFAST_EXPECTED_COMMIT || body?.source_revision?.commit_ref !== process.env.BIDFAST_EXPECTED_REF) failures.push('dashboard_provenance')
          if (body?.reference?.drive_file_id !== process.env.DASHBOARD_REFERENCE_ID || body?.reference?.sha256 !== process.env.DASHBOARD_REFERENCE_SHA256) failures.push('dashboard_reference')
          if (!(score > Number(process.env.RETAINED_BASELINE))) failures.push(`dashboard_score=${score}`)
          if (!(Number(target?.diagnostic_score) > Number(process.env.QUICK_ACTIONS_BASELINE))) failures.push(`quick_actions_score=${target?.diagnostic_score}`)
          if (!(Number(target?.edge_similarity) > Number(process.env.QUICK_ACTIONS_EDGE_BASELINE))) failures.push(`quick_actions_edge=${target?.edge_similarity}`)
          for (const key of ['console_errors','app_network_errors','http_errors']) if (!Array.isArray(body[key]) || body[key].length) failures.push(`dashboard_${key}`)
          const summary = { candidate_commit: process.env.BIDFAST_EXPECTED_COMMIT, source_revision: body.source_revision, metrics: body.metrics, quick_actions: target, live_sha256: body?.live?.sha256, failures, release_authorized: false }
          fs.writeFileSync('evidence/dashboard-quick-actions-summary.json', JSON.stringify(summary, null, 2) + '\n')
          if (failures.length) throw new Error(failures.join(','))
          NODE

      - name: Run ten-route non-regression matrix in one worker
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            '/dashboard|0.810876'
            '/analytics|0.830446'
            '/approvals|0.859067'
            '/opportunities|0.859699'
            '/estimates/new|0.813012'
            '/proposals|0.819855'
            '/projects/demo-riverside|0.818791'
            '/takeoffs/demo-riverside|0.818538'
            '/settings/company|0.825706'
            '/assistant|0.823121'
          )
          : > evidence/matrix-results.ndjson
          for item in "${routes[@]}"; do
            route="${item%%|*}"
            baseline="${item##*|}"
            slug="$(printf '%s' "$route" | sed 's#^/##; s#[^A-Za-z0-9._-]#_#g')"
            encoded="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$route")"
            if [[ "$route" == '/opportunities' ]]; then
              endpoint="${BROWSERWORKER_PREVIEW}/api/bidfast-opportunities-single-capture?expected_commit=${BIDFAST_EXPECTED_COMMIT}"
            else
              endpoint="${BROWSERWORKER_PREVIEW}/api/validation/bidfast-parity-v3?route=${encoded}&expected_commit=${BIDFAST_EXPECTED_COMMIT}"
            fi
            passed=false
            for attempt in $(seq 1 8); do
              status="$(curl -sS --max-time 240 -o "evidence/matrix/${slug}.json" -w '%{http_code}' "$endpoint" || true)"
              commit="$(node -e "try{const j=require('./evidence/matrix/${slug}.json');process.stdout.write(String(j?.source_revision?.commit_sha||''))}catch{}")"
              if [[ "$status" == '200' && "$commit" == "$BIDFAST_EXPECTED_COMMIT" ]]; then passed=true; break; fi
              [[ "$attempt" != '8' ]] && sleep 20
            done
            [[ "$passed" == true ]] || { echo "capture failed for $route"; exit 1; }
            ROUTE="$route" BASELINE="$baseline" FILE="evidence/matrix/${slug}.json" node - <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync(process.env.FILE, 'utf8'))
          const route = process.env.ROUTE
          const metrics = route === '/opportunities' ? body?.official_metrics : body?.metrics
          const failures = []
          if (body.ok !== true || body.provenance_pass !== true || body.integrity_pass !== true || body.technical_pass !== true) failures.push('evidence_gate')
          if (body.route !== route) failures.push('route')
          if (body?.source_revision?.commit_sha !== process.env.BIDFAST_EXPECTED_COMMIT || body?.source_revision?.commit_ref !== process.env.BIDFAST_EXPECTED_REF) failures.push('provenance')
          if (route === '/opportunities' && body.screenshot_coherence_pass !== true) failures.push('screenshot_coherence')
          if (!Number.isFinite(metrics?.composite_score) || metrics.composite_score < Number(process.env.BASELINE)) failures.push('score')
          if (!/^[0-9a-f]{64}$/.test(body?.live?.sha256 || '') || !/^[0-9a-f]{64}$/.test(body?.reference?.sha256 || '')) failures.push('hash')
          for (const key of ['console_errors','app_network_errors','http_errors']) if (!Array.isArray(body[key]) || body[key].length) failures.push(key)
          if (body.release_authorized === true) failures.push('release_authorized')
          const result = { route, score: metrics?.composite_score, baseline: Number(process.env.BASELINE), source_revision: body.source_revision, live_sha256: body?.live?.sha256, reference_sha256: body?.reference?.sha256, failures }
          fs.appendFileSync('evidence/matrix-results.ndjson', JSON.stringify(result) + '\n')
          if (failures.length) throw new Error(`${route}: ${failures.join(',')}`)
          NODE
          done
          node - <<'NODE'
          const fs = require('node:fs')
          const routes = fs.readFileSync('evidence/matrix-results.ndjson','utf8').trim().split('\n').filter(Boolean).map(JSON.parse)
          const summary = { candidate: process.env.BIDFAST_EXPECTED_COMMIT, route_count: routes.length, passed: routes.length === 10 && routes.every(r => r.failures.length === 0), routes, release_threshold: Number(process.env.RELEASE_THRESHOLD), release_authorized: false }
          fs.writeFileSync('evidence/full-matrix-summary.json', JSON.stringify(summary, null, 2) + '\n')
          if (!summary.passed) process.exit(1)
          NODE

      - name: Upload immutable candidate and matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidfast-dashboard-quick-actions-1bc566b8-complete
          path: evidence/
          if-no-files-found: error
          retention-days: 30
