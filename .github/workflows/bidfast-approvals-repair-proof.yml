name: BIDFAST Approvals Repair Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bidfast-approvals-repair-proof.yml'
      - 'app/api/bidfast-parity-v2/**'
      - 'app/api/bidfast-proof/**'
      - 'app/api/validation/bidfast-parity-v3/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidfast-approvals-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  BROWSERWORKER_PREVIEW: https://browserworker-git-auto-builder-82ac4c-strategic-minds-advisory.vercel.app
  BIDFAST_EXPECTED_COMMIT: 6977420359478e02b4626a7f1c16243fdae26fb4
  BIDFAST_EXPECTED_REF: auto-builder/bidfast-complete-visual-system
  RETAINED_BASELINE: '0.802620'
  VISUAL_THRESHOLD: '0.99'

jobs:
  approvals:
    name: Approval queue revision-pinned proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out BrowserWorker proof branch
        uses: actions/checkout@v4

      - name: Wait for BrowserWorker health
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${BROWSERWORKER_PREVIEW}/api/health"
          for attempt in $(seq 1 24); do
            status="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$endpoint" || true)"
            if [[ "$status" == "200" ]]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $attempt returned ${status:-no-status}; waiting."
            sleep 15
          done
          exit 1

      - name: Preserve raw approvals technical proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          endpoint="${BROWSERWORKER_PREVIEW}/api/bidfast-proof?route=%2Fapprovals&theme=light&viewport=mobile"
          status="$(curl -sS --retry 2 --retry-all-errors --max-time 180 -o evidence/approvals.proof.json -w '%{http_code}' "$endpoint")"
          printf '%s\n' "$status" > evidence/approvals.proof.http-status.txt
          cat evidence/approvals.proof.json

      - name: Execute exact approvals parity proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          endpoint="${BROWSERWORKER_PREVIEW}/api/validation/bidfast-parity-v3?route=%2Fapprovals&expected_commit=${BIDFAST_EXPECTED_COMMIT}"
          status="$(curl -sS --retry 2 --retry-all-errors --max-time 210 -o evidence/approvals.json -w '%{http_code}' "$endpoint")"
          printf '%s\n' "$status" > evidence/approvals.http-status.txt
          cat evidence/approvals.json

      - name: Capture implemented-component screenshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          endpoint="${BROWSERWORKER_PREVIEW}/api/bidfast-proof?route=%2Fapprovals&theme=light&viewport=mobile&format=image"
          status="$(curl -sS --retry 2 --retry-all-errors --max-time 180 -D evidence/approvals.live.headers.txt -o evidence/approvals.live.png -w '%{http_code}' "$endpoint" || true)"
          printf '%s\n' "$status" > evidence/approvals.live.http-status.txt
          if [[ -s evidence/approvals.live.png ]]; then
            file evidence/approvals.live.png | tee evidence/approvals.live.file.txt
            sha256sum evidence/approvals.live.png | tee evidence/approvals.live.sha256.txt
          fi

      - name: Enforce provenance, technical, integrity, and non-regression gates
        shell: bash
        run: |
          set -euo pipefail
          node - evidence/approvals.json evidence/approvals.live.png "$BIDFAST_EXPECTED_COMMIT" "$BIDFAST_EXPECTED_REF" "$RETAINED_BASELINE" <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const [jsonFile, screenshotFile, expectedCommit, expectedRef, baselineText] = process.argv.slice(2)
          const body = JSON.parse(fs.readFileSync(jsonFile, 'utf8'))
          const baseline = Number(baselineText)
          const score = body?.metrics?.composite_score
          const failures = []
          if (body.ok !== true) failures.push(`ok=${String(body.ok)}`)
          if (body.route !== '/approvals') failures.push(`route=${String(body.route)}`)
          if (body.provenance_pass !== true) failures.push(`provenance_pass=${String(body.provenance_pass)}`)
          if (body?.source_revision?.commit_sha !== expectedCommit) failures.push(`commit_sha=${String(body?.source_revision?.commit_sha)}`)
          if (body?.source_revision?.commit_ref !== expectedRef) failures.push(`commit_ref=${String(body?.source_revision?.commit_ref)}`)
          if (body.integrity_pass !== true) failures.push(`integrity_pass=${String(body.integrity_pass)}`)
          if (body.technical_pass !== true) failures.push(`technical_pass=${String(body.technical_pass)}`)
          if (typeof score !== 'number' || !Number.isFinite(score)) failures.push('composite score missing')
          else if (score <= baseline) failures.push(`composite_score=${score} did not exceed retained baseline ${baseline}`)
          for (const [name, value] of [['console_errors', body.console_errors], ['app_network_errors', body.app_network_errors], ['http_errors', body.http_errors]]) {
            if (!Array.isArray(value)) failures.push(`${name} missing`)
            else if (value.length !== 0) failures.push(`${name}=${JSON.stringify(value)}`)
          }
          if (!fs.existsSync(screenshotFile)) failures.push('implemented-component screenshot missing')
          else {
            const screenshotSha = crypto.createHash('sha256').update(fs.readFileSync(screenshotFile)).digest('hex')
            if (screenshotSha !== body?.live?.sha256) failures.push(`screenshot_sha=${screenshotSha} expected=${String(body?.live?.sha256)}`)
          }
          console.log(JSON.stringify({ route: '/approvals', baseline, score: score ?? null, threshold: Number(process.env.VISUAL_THRESHOLD), source_revision: body.source_revision ?? null, failures }, null, 2))
          if (failures.length) process.exit(1)
          NODE

      - name: Upload immutable approvals repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidfast-approvals-repair-proof
          path: evidence/
          if-no-files-found: error
          retention-days: 30
