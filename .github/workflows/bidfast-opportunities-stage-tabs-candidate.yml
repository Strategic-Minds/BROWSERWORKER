name: BIDFAST Opportunities Stage Tabs Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bidfast-opportunities-stage-tabs-candidate.yml'
  push:
    branches:
      - auto-builder/bidfast-proof-20260728
    paths:
      - '.github/workflows/bidfast-opportunities-stage-tabs-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidfast-opportunities-stage-tabs-584767bb
  cancel-in-progress: true

env:
  BROWSERWORKER_PREVIEW: https://browserworker-git-auto-builder-82ac4c-strategic-minds-advisory.vercel.app
  BIDFAST_EXPECTED_COMMIT: 584767bbd75aad1c7b9459bbc710cd225e51ec53
  BIDFAST_EXPECTED_REF: auto-builder/bidfast-complete-visual-system
  RETAINED_COMPOSITE: '0.858978'
  RETAINED_REGIONAL: '0.791098'
  RETAINED_STAGE_TABS: '0.773582'
  RELEASE_THRESHOLD: '0.99'

jobs:
  validate:
    name: Measure isolated stage-tab geometry candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for exact candidate and capture once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          endpoint="${BROWSERWORKER_PREVIEW}/api/bidfast-opportunities-single-capture?expected_commit=${BIDFAST_EXPECTED_COMMIT}"
          for attempt in $(seq 1 45); do
            status="$(curl -sS --max-time 210 -o evidence/stage-tabs-candidate.json -w '%{http_code}' "$endpoint" || true)"
            commit="$(node -e "try{const j=require('./evidence/stage-tabs-candidate.json');process.stdout.write(String(j.source_revision?.commit_sha||''))}catch{}")"
            version="$(node -e "try{const j=require('./evidence/stage-tabs-candidate.json');process.stdout.write(String(j.validator_version||''))}catch{}")"
            if [[ "$status" == "200" && "$commit" == "$BIDFAST_EXPECTED_COMMIT" && "$version" == "opportunities-single-capture-v1" ]]; then
              cat evidence/stage-tabs-candidate.json
              exit 0
            fi
            echo "candidate attempt ${attempt}: status=${status:-none} commit=${commit:-unknown} version=${version:-unknown}"
            cat evidence/stage-tabs-candidate.json || true
            sleep 20
          done
          exit 1

      - name: Enforce strict improvement and release lock
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync('evidence/stage-tabs-candidate.json', 'utf8'))
          const official = body?.official_metrics || {}
          const regional = body?.regional?.overall || {}
          const regions = Array.isArray(body?.regional?.regions) ? body.regional.regions : []
          const stage = regions.find(region => region.name === 'stage_tabs') || {}
          const failures = []
          if (body.ok !== true) failures.push(`ok=${String(body.ok)}`)
          if (body.source_revision?.commit_sha !== process.env.BIDFAST_EXPECTED_COMMIT) failures.push(`commit_sha=${String(body.source_revision?.commit_sha)}`)
          if (body.source_revision?.commit_ref !== process.env.BIDFAST_EXPECTED_REF) failures.push(`commit_ref=${String(body.source_revision?.commit_ref)}`)
          if (body.provenance_pass !== true) failures.push(`provenance_pass=${String(body.provenance_pass)}`)
          if (body.integrity_pass !== true) failures.push(`integrity_pass=${String(body.integrity_pass)}`)
          if (body.technical_pass !== true) failures.push(`technical_pass=${String(body.technical_pass)}`)
          if (body.screenshot_coherence_pass !== true) failures.push(`screenshot_coherence_pass=${String(body.screenshot_coherence_pass)}`)
          if (!Number.isFinite(official.composite_score) || official.composite_score <= Number(process.env.RETAINED_COMPOSITE)) failures.push(`official_composite=${String(official.composite_score)}`)
          if (!Number.isFinite(regional.diagnostic_score) || regional.diagnostic_score < Number(process.env.RETAINED_REGIONAL)) failures.push(`regional_score=${String(regional.diagnostic_score)}`)
          if (!Number.isFinite(stage.diagnostic_score) || stage.diagnostic_score <= Number(process.env.RETAINED_STAGE_TABS)) failures.push(`stage_tabs_score=${String(stage.diagnostic_score)}`)
          if (!Array.isArray(body.console_errors) || body.console_errors.length !== 0) failures.push(`console_errors=${JSON.stringify(body.console_errors)}`)
          if (!Array.isArray(body.app_network_errors) || body.app_network_errors.length !== 0) failures.push(`app_network_errors=${JSON.stringify(body.app_network_errors)}`)
          if (!Array.isArray(body.http_errors) || body.http_errors.length !== 0) failures.push(`http_errors=${JSON.stringify(body.http_errors)}`)
          if (official.composite_score >= Number(process.env.RELEASE_THRESHOLD)) failures.push('unexpected_release_threshold_pass')
          if (body.release_authorized !== false) failures.push(`release_authorized=${String(body.release_authorized)}`)
          console.log(JSON.stringify({
            source_revision: body.source_revision,
            live_sha256: body.live?.sha256,
            official_metrics: official,
            regional_overall: regional,
            stage_tabs: stage,
            baselines: {
              official: Number(process.env.RETAINED_COMPOSITE),
              regional: Number(process.env.RETAINED_REGIONAL),
              stage_tabs: Number(process.env.RETAINED_STAGE_TABS),
            },
            failures,
          }, null, 2))
          if (failures.length) process.exit(1)
          NODE

      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidfast-opportunities-stage-tabs-584767bb
          path: evidence/
          if-no-files-found: error
          retention-days: 30
